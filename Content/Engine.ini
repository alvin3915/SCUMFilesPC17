[SystemSettings]

; =========================
; VIEW DISTANCE / POP-IN CONTROL
; =========================

r.ViewDistanceScale=1.18
r.HLOD=1
r.HZBOcclusion=1

; giữ LOD xa hơn bản tối ưu, nhưng không quá nặng như bản cũ
r.StaticMeshLODDistanceScale=0.80

foliage.LODDistanceScale=1.20
grass.CullDistanceScale=1.10

; =========================
; TEXTURE STREAMING (ỔN ĐỊNH VRAM 8GB)
; =========================

r.Streaming.LimitPoolSizeToVRAM=1

; sweet spot cho RTX 2070 / 8GB
r.Streaming.PoolSize=5632

r.Streaming.MaxTempMemoryAllowed=256

; =========================
; SHADOW (GIẢM CPU SPIKE NHƯNG KHÔNG QUÁ THẤP)
; =========================

r.Shadow.DistanceScale=1.05
r.ContactShadows=0

; =========================
; POST PROCESS (CLEAR IMAGE)
; =========================

r.MotionBlurQuality=0
r.MotionBlur.Amount=0
r.DefaultFeature.MotionBlur=0

r.SceneColorFringeQuality=0
r.DepthOfFieldQuality=0

; =========================
; ANISOTROPY (FREE QUALITY)
; =========================

r.MaxAnisotropy=16

; =========================
; TAA (STABLE IMAGE + SHARPNESS CONTROL)
; =========================

r.TemporalAACurrentFrameWeight=0.2
r.TemporalAASamples=12
r.TemporalAAFilterSize=1.0

; =========================
; STABILITY FLAGS
; =========================

r.OneFrameThreadLag=1
